<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Skor Avcısı — Instagram Maç Tahmini Video Üretici</title>
<style>
  :root{--bg:#0b1220;--panel:#131c2e;--panel2:#1b2740;--line:#2a3a5c;--text:#eef3ff;--muted:#93a2c4;--accent:#ffd60a;--good:#3ddc84;--bad:#ff5c5c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1d2b4d 0%,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:520px;padding:16px 14px 32px;display:flex;flex-direction:column;gap:14px}
  .app>*{flex-shrink:0}
  header{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:22px}.logo span{color:var(--accent)}
  .sub{font-size:11px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .src{font-size:10px;text-transform:none;letter-spacing:0}.src.ok{color:var(--good)}.src.err{color:var(--bad)}
  .leaguebar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}.leaguebar::-webkit-scrollbar{display:none}
  .leaguebar button{flex:none;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .leaguebar button.active{background:var(--accent);color:#1a1200;border-color:var(--accent)}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
  .teamsel{display:flex;flex-direction:column;gap:8px;align-items:center}
  .badge{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#fff;color:#111;box-shadow:0 6px 16px rgba(0,0,0,.4);overflow:hidden;border:3px solid #fff2}
  .badge img{width:80%;height:80%;object-fit:contain}
  select,input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;width:100%}
  select{max-width:170px}
  .vs{font-weight:900;color:var(--accent);font-size:18px;padding-top:24px}
  .strength{font-size:11px;color:var(--muted);text-align:center}
  .rnd{font-size:11px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}
  .predict{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .stepper{display:flex;align-items:center;justify-content:center;gap:10px}
  .stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;font-weight:700;cursor:pointer}
  .stepper .num{font-size:34px;font-weight:900;min-width:40px;text-align:center}
  .seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer;font-size:12px}
  .seg button.active{background:var(--accent);color:#1a1200;border-color:var(--accent)}
  .btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer;background:linear-gradient(90deg,var(--accent),#ff9f1c);color:#1a1200;box-shadow:0 8px 20px rgba(255,214,10,.25)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.secondary{background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
  .btns{display:flex;gap:8px}
  .stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);background:#000}
  canvas{display:block;width:100%;height:auto}
  .rec{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;display:none;align-items:center;gap:6px}
  .rec.on{display:flex}.rec i{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  video{width:100%;border-radius:14px;background:#000;display:block}
  .hidden{display:none!important}
  .note{font-size:11px;color:var(--muted);line-height:1.5}
  footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.6}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="logo">⚽ SKOR<span>AVCISI</span></div><div class="sub">Instagram için maç tahmini videosu üret</div></div>
  </header>

  <section class="card" id="setup">
    <h3>Lig <span class="src" id="src"><span class="spin"></span> yükleniyor</span></h3>
    <div class="leaguebar" id="leaguebar"></div>
    <h3>Takımlar <button class="rnd" id="rndBtn">🎲 Rastgele</button></h3>
    <div class="teams">
      <div class="teamsel"><div class="badge" id="homeBadge"></div><select id="homeSel"></select><div class="strength" id="homeStr"></div></div>
      <div class="vs">VS</div>
      <div class="teamsel"><div class="badge" id="awayBadge"></div><select id="awaySel"></select><div class="strength" id="awayStr"></div></div>
    </div>
    <h3 style="margin-top:14px">Videodaki final skoru <button class="rnd" id="rndScore">🎲 Güce göre rastgele</button></h3>
    <div class="predict">
      <div class="stepper"><button data-t="h" data-d="-1">−</button><div class="num" id="ph">2</div><button data-t="h" data-d="1">+</button></div>
      <div class="vs" style="padding:0">:</div>
      <div class="stepper"><button data-t="a" data-d="-1">−</button><div class="num" id="pa">1</div><button data-t="a" data-d="1">+</button></div>
    </div>
    <h3 style="margin-top:14px">Video ayarları</h3>
    <div class="row" style="margin-bottom:10px">
      <label class="f">Süre <div class="seg" id="durSeg"><button data-v="15">15s</button><button data-v="30" class="active">30s</button><button data-v="45">45s</button><button data-v="60">60s</button></div></label>
      <label class="f">Başlık <input type="text" id="title" value="MAÇ TAHMİNİ" maxlength="24"></label>
    </div>
    <div class="row" style="margin-bottom:14px">
      <label class="f">Kullanıcı adı (filigran) <input type="text" id="handle" value="@skoravcisi" maxlength="28"></label>
      <label class="f">Alt yazı (CTA) <input type="text" id="cta" value="Sence skor ne olur? Yoruma yaz 👇" maxlength="40"></label>
    </div>
    <div class="btns">
      <button class="btn" id="recBtn" disabled>🎬 VİDEOYU ÜRET</button>
      <button class="btn secondary" id="playBtn" disabled style="flex:0 0 120px">▶ Önizle</button>
    </div>
  </section>

  <section class="stage hidden" id="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="rec" id="recTag"><i></i> KAYIT</div>
  </section>
  <div class="btns hidden" id="stageBtns"><button class="btn secondary" id="stopBtn">⏹ Durdur ve geri dön</button></div>

  <section class="card hidden" id="out">
    <h3>Video hazır <span class="src ok" id="outInfo"></span></h3>
    <video id="preview" controls playsinline></video>
    <div class="btns" style="margin-top:10px">
      <button class="btn" id="shareBtn">📤 Instagram'a paylaş</button>
      <a class="btn secondary" id="dlBtn" download="skoravcisi.mp4" style="text-align:center;text-decoration:none;flex:0 0 120px">⬇ İndir</a>
    </div>
    <p class="note" style="margin-top:10px" id="outNote"></p>
    <button class="btn secondary" id="againBtn" style="margin-top:10px">🔁 Yeni video</button>
  </section>

  <footer>Takım verileri ve logolar: ESPN herkese açık API · 1080×1920 dikey, Reels ve Story için hazır</footer>
</div>

<script src="teams-data.js"></script>
<script>
/* ---------- LEAGUES / API ---------- */
const LEAGUES=[
  {id:"tur.1",n:"Süper Lig",flag:"🇹🇷",coef:1.0},{id:"eng.1",n:"Premier League",flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",coef:1.12},{id:"esp.1",n:"La Liga",flag:"🇪🇸",coef:1.1},
  {id:"ger.1",n:"Bundesliga",flag:"🇩🇪",coef:1.08},{id:"ita.1",n:"Serie A",flag:"🇮🇹",coef:1.08},{id:"fra.1",n:"Ligue 1",flag:"🇫🇷",coef:1.05},
  {id:"uefa.champions",n:"Şampiyonlar Ligi",flag:"🏆",coef:1.15},{id:"uefa.europa",n:"Avrupa Ligi",flag:"🥈",coef:1.05},{id:"uefa.europa.conf",n:"Konferans Ligi",flag:"🥉",coef:0.98},
  {id:"ned.1",n:"Eredivisie",flag:"🇳🇱",coef:1.0},{id:"por.1",n:"Portekiz",flag:"🇵🇹",coef:1.0},{id:"bel.1",n:"Belçika",flag:"🇧🇪",coef:0.97},{id:"sco.1",n:"İskoçya",flag:"🏴󠁧󠁢󠁳󠁣󠁴󠁿",coef:0.95},
  {id:"bra.1",n:"Brezilya",flag:"🇧🇷",coef:1.0},{id:"arg.1",n:"Arjantin",flag:"🇦🇷",coef:0.98},{id:"usa.1",n:"MLS",flag:"🇺🇸",coef:0.95},{id:"mex.1",n:"Meksika",flag:"🇲🇽",coef:0.95},
];
const API=id=>`https://site.api.espn.com/apis/v2/sports/soccer/${id}/standings`;
const cache=JSON.parse(localStorage.getItem("skoravcisi_teams")||"{}");
const PALETTE=["#1e3a8a","#b91c1c","#065f46","#7c3aed","#c2410c","#0e7490","#be185d","#4d7c0f","#92400e","#1f2937"];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)); const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h}; const pick=a=>a[Math.floor(Math.random()*a.length)];
function normalize(d){ const out=[]; (d.children||[d]).forEach(g=>g.standings.entries.forEach((e,i)=>{ const st={}; e.stats.forEach(s=>st[s.name]=s.value); const t=e.team;
  out.push({id:t.id,n:t.displayName,s:(t.abbreviation||t.displayName.slice(0,3)).toUpperCase(),logo:(t.logos&&t.logos[0]&&t.logos[0].href)||"",gp:st.gamesPlayed||0,gf:st.pointsFor||0,ga:st.pointsAgainst||0,pts:st.points||0,rank:st.rank||i+1}); })); return out; }
function buildTeams(entries,lg){ const teams=entries.map(e=>{ const gp=Math.max(1,e.gp),gf=e.gf/gp,ga=e.ga/gp,w=Math.min(1,gp/10);
  return {...e,att:clamp(Math.round((55+(w*gf+(1-w)*1.4)*14)*lg.coef),45,96),def:clamp(Math.round((58+(3.0-(w*ga+(1-w)*1.4))*12)*lg.coef),45,96),gp,c:PALETTE[hash(e.n)%PALETTE.length]}; });
  teams.sort((a,b)=>a.n.localeCompare(b.n,"tr")); return teams; }
let dataSource="";
async function loadLeague(lg){
  const c=cache[lg.id]; if(c&&c.entries&&c.src==="canlı"&&Date.now()-c.t<12*3600e3){ dataSource="canlı"; return buildTeams(c.entries,lg); }
  let entries;
  try{ const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),7000); const r=await fetch(API(lg.id),{signal:ctrl.signal}); clearTimeout(to);
    if(!r.ok) throw new Error("HTTP "+r.status); entries=normalize(await r.json()); dataSource="canlı"; }
  catch(e){ const snap=window.TEAM_SNAPSHOT&&window.TEAM_SNAPSHOT.leagues&&window.TEAM_SNAPSHOT.leagues[lg.id]; if(!snap) throw e; entries=snap; dataSource="yedek"; }
  cache[lg.id]={t:Date.now(),entries,src:dataSource}; try{localStorage.setItem("skoravcisi_teams",JSON.stringify(cache))}catch{}
  return buildTeams(entries,lg);
}
// logo image (CORS-safe so the canvas can be recorded) + dominant colour
function loadLogo(team){
  return new Promise(res=>{
    if(!team.logo) return res(null);
    const img=new Image(); img.crossOrigin="anonymous";
    img.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=c.height=24; const x=c.getContext("2d"); x.drawImage(img,0,0,24,24);
      const px=x.getImageData(0,0,24,24).data; let best=null,bs=-1;
      for(let i=0;i<px.length;i+=4){ const r=px[i],g=px[i+1],b=px[i+2],a=px[i+3]; if(a<200) continue; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); const sc=(mx-mn)+(mx<60?-40:0)+(mn>200?-60:0); if(sc>bs){bs=sc;best=[r,g,b]} }
      team.col=best?`rgb(${best.join(",")})`:team.c; }catch{ team.col=team.c } res(img); };
    img.onerror=()=>{ team.col=team.c; res(null); }; img.src=team.logo;
  });
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
let league=LEAGUES[0],teams=[],home,away,score={h:2,a:1},duration=30;
function renderLeagueBar(){ $("leaguebar").innerHTML=LEAGUES.map(l=>`<button data-id="${l.id}" class="${l===league?"active":""}">${l.flag} ${l.n}</button>`).join("");
  $("leaguebar").querySelectorAll("button").forEach(b=>b.onclick=()=>{ league=LEAGUES.find(l=>l.id===b.dataset.id); renderLeagueBar(); selectLeague(); }); }
async function selectLeague(){
  $("src").className="src"; $("src").innerHTML=`<span class="spin"></span> ${league.n} yükleniyor`; $("recBtn").disabled=$("playBtn").disabled=true;
  try{ teams=await loadLeague(league); $("src").className="src ok"; $("src").textContent=`${teams.length} takım · ${dataSource==="canlı"?"canlı ESPN verisi ✓":"yedek veri"}`; }
  catch(e){ teams=[]; $("src").className="src err"; $("src").textContent="veri alınamadı, başka lig dene"; }
  if(!teams.length) return;
  [$("homeSel"),$("awaySel")].forEach(sel=>sel.innerHTML=teams.map((t,i)=>`<option value="${i}">${t.n}</option>`).join(""));
  $("homeSel").value=0; $("awaySel").value=Math.min(1,teams.length-1); updateTeams(); $("recBtn").disabled=$("playBtn").disabled=false;
}
function paintBadge(el,t){ el.innerHTML=t.logo?`<img src="${t.logo}" alt="${t.s}" onerror="this.replaceWith(document.createTextNode('${t.s}'))">`:t.s; }
function updateTeams(){ home=teams[$("homeSel").value]; away=teams[$("awaySel").value];
  if(home===away){ $("awaySel").value=(+$("awaySel").value+1)%teams.length; away=teams[$("awaySel").value]; }
  paintBadge($("homeBadge"),home); paintBadge($("awayBadge"),away);
  const str=t=>`HÜC <b>${t.att}</b> · SAV <b>${t.def}</b><br>${t.rank}. sıra · ${t.pts} puan`; $("homeStr").innerHTML=str(home); $("awayStr").innerHTML=str(away); }
$("homeSel").onchange=$("awaySel").onchange=updateTeams;
$("rndBtn").onclick=()=>{ if(!teams.length) return; const a=Math.floor(Math.random()*teams.length); let b=Math.floor(Math.random()*(teams.length-1)); if(b>=a) b++; $("homeSel").value=a; $("awaySel").value=b; updateTeams(); };
$("rndScore").onclick=()=>{ const pois=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1};
  score.h=clamp(pois(1.35*(home.att/away.def)*1.1),0,7); score.a=clamp(pois(1.35*(away.att/home.def)*0.9),0,7); $("ph").textContent=score.h; $("pa").textContent=score.a; };
document.querySelectorAll(".stepper button").forEach(b=>b.onclick=()=>{ score[b.dataset.t]=clamp(score[b.dataset.t]+ +b.dataset.d,0,9); $("ph").textContent=score.h; $("pa").textContent=score.a; });
$("durSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ duration=+b.dataset.v; $("durSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b)); });
$("recBtn").onclick=()=>run(true); $("playBtn").onclick=()=>run(false);
$("stopBtn").onclick=()=>{ stopRun(true); showSetup(); };
$("againBtn").onclick=showSetup;
function showSetup(){ ["stage","stageBtns","out"].forEach(i=>$(i).classList.add("hidden")); $("setup").classList.remove("hidden"); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- RENDER / SIM (1080x1920 vertical) ---------- */
const cv=$("cv"),ctx=cv.getContext("2d"),W=1080,H=1920;
const P={x:70,y:250,w:940,h:1100}; // pitch rect
const GOAL_W=200;
const FORM=[[.5,.93],[.2,.75],[.4,.78],[.6,.78],[.8,.75],[.3,.58],[.7,.58],[.5,.62],[.25,.42],[.5,.35],[.75,.42]];
let game=null,raf=null,rec=null,chunks=[];
const LEAD=2000,TAIL=4500; // ms before kickoff and after full time

async function run(record){
  $("setup").classList.add("hidden"); ["stage","stageBtns"].forEach(i=>$(i).classList.remove("hidden")); $("out").classList.add("hidden");
  $("recTag").classList.toggle("on",record);
  $("stage").scrollIntoView({behavior:"smooth",block:"start"});
  const [hImg,aImg]=await Promise.all([loadLogo(home),loadLogo(away)]);
  // goal minutes for the chosen final score, spread out and never on the same minute
  const used=new Set(); const mins=()=>{let m;do{m=1+Math.floor(Math.random()*89)}while(used.has(m)||used.has(m-1)||used.has(m+1));used.add(m);return m};
  const events=[]; for(let i=0;i<score.h;i++) events.push({min:mins(),type:"goal",team:"h"}); for(let i=0;i<score.a;i++) events.push({min:mins(),type:"goal",team:"a"});
  for(let m=1;m<=90;m++) if(!used.has(m)&&Math.random()<0.08) events.push({min:m,type:"chance",team:Math.random()<0.5?"h":"a"});
  const players=[]; FORM.forEach(([fx,fy],i)=>{ players.push({team:"h",hx:P.x+fx*P.w,hy:P.y+fy*P.h,ph:i}); players.push({team:"a",hx:P.x+fx*P.w,hy:P.y+(1-fy)*P.h,ph:i+11}); }); players.forEach(p=>{p.x=p.hx;p.y=p.hy});
  const msPerMin=(duration*1000-LEAD-TAIL)/90;
  game={t0:performance.now(),last:performance.now(),min:0,sh:0,sa:0,events,players,ball:{x:W/2,y:P.y+P.h/2,vx:0,vy:0},shoot:null,idle:0,flash:null,hImg,aImg,
        title:$("title").value||"MAÇ TAHMİNİ",handle:$("handle").value,cta:$("cta").value,msPerMin,done:false,record};
  if(record) startRecorder();
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function startRecorder(){
  chunks=[]; const stream=cv.captureStream(30);
  const types=["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mime){ alert("Bu tarayıcı video kaydını desteklemiyor. iPhone'da Safari, Android'de Chrome kullan."); return; }
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); showOutput(blob,mime); };
  rec.start(250);
}
function stopRun(abort){ cancelAnimationFrame(raf); if(game) game.done=true; if(rec&&rec.state!=="inactive"){ if(abort) rec.onstop=null; rec.stop(); } rec=null; }
function showOutput(blob,mime){
  const ext=mime.includes("mp4")?"mp4":"webm"; const url=URL.createObjectURL(blob); const file=new File([blob],`skoravcisi-${home.s}-${away.s}.${ext}`,{type:mime.split(";")[0]});
  $("preview").src=url; $("dlBtn").href=url; $("dlBtn").download=file.name;
  $("outInfo").textContent=`${(blob.size/1e6).toFixed(1)} MB · ${ext.toUpperCase()} · ${duration}s`;
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $("shareBtn").classList.toggle("hidden",!canShare);
  $("shareBtn").onclick=()=>navigator.share({files:[file],title:"Skor Avcısı"}).catch(()=>{});
  $("outNote").textContent= canShare ? "Paylaş'a bas, listeden Instagram'ı seç; Reels ya da Story olarak yükle." :
    ext==="webm" ? "Bu tarayıcı WEBM üretti. Instagram MP4 ister: videoyu indirip telefona at, ya da iPhone Safari / Android Chrome'dan üret, orada direkt paylaş çıkar." : "İndir'e bas, galeriye kaydet, Instagram'dan yükle.";
  ["stage","stageBtns"].forEach(i=>$(i).classList.add("hidden")); $("out").classList.remove("hidden"); $("out").scrollIntoView({behavior:"smooth",block:"start"});
}

function loop(now){
  if(!game||game.done) return;
  const dt=Math.min(50,now-game.last); game.last=now; const k=dt/16.67; const el=now-game.t0;
  const matchMs=el-LEAD;
  if(matchMs>0 && game.min<90){
    const target=Math.min(90,Math.floor(matchMs/game.msPerMin)+1);
    while(game.min<target){ game.min++; if(game.min===46) game.flash={text:"2. YARI",sub:"",t:now,dur:1200,big:false};
      for(const e of game.events.filter(e=>e.min===game.min)){ const t=e.team==="h"?home:away;
        if(e.type==="goal"){ if(e.team==="h") game.sh++; else game.sa++; game.shoot={team:e.team,t:0}; game.flash={text:"GOOOL!",sub:`${t.n} ${game.min}'`,t:now,dur:1800,big:true,col:t.col}; }
        else { kickToward(e.team,1.0); } } }
    if(game.min>=90 && !game.ftAt){ game.ftAt=now; game.flash=null; }
  }
  stepPhysics(k); draw(now);
  if(game.ftAt && now-game.ftAt>TAIL){ game.done=true; if(rec) rec.stop(); else { $("stopBtn").click(); } return; }
  raf=requestAnimationFrame(loop);
}
function kickToward(team,power){ const b=game.ball,gy=team==="h"?P.y:P.y+P.h,tx=W/2+(Math.random()-0.5)*300,dx=tx-b.x,dy=gy-b.y,d=Math.hypot(dx,dy)||1,sp=(7+Math.random()*7)*power; b.vx=dx/d*sp; b.vy=dy/d*sp; }
function stepPhysics(k){
  const b=game.ball;
  if(game.shoot){ game.shoot.t+=0.035*k; const gy=game.shoot.team==="h"?P.y-30:P.y+P.h+30; b.x+=(W/2-b.x)*0.12*k; b.y+=(gy-b.y)*0.14*k; b.vx=b.vy=0;
    if(game.shoot.t>1.6){ game.shoot=null; b.x=W/2; b.y=P.y+P.h/2; kickToward(Math.random()<0.5?"h":"a",0.5); } return; }
  b.x+=b.vx*k; b.y+=b.vy*k; const fr=Math.pow(0.985,k); b.vx*=fr; b.vy*=fr;
  if(Math.hypot(b.vx,b.vy)<0.5){ game.idle+=k; if(game.idle>10){ game.idle=0; const a=Math.random()*Math.PI*2,sp=4+Math.random()*8; b.vx=Math.cos(a)*sp; b.vy=Math.sin(a)*sp; } } else game.idle=0;
  const inMouth=Math.abs(b.x-W/2)<GOAL_W/2;
  if(b.y<P.y){ if(inMouth&&b.y<P.y-30) resetBall(); else if(!inMouth){ b.y=P.y; b.vy=-b.vy*0.6; } }
  if(b.y>P.y+P.h){ if(inMouth&&b.y>P.y+P.h+30) resetBall(); else if(!inMouth){ b.y=P.y+P.h; b.vy=-b.vy*0.6; } }
  if(b.x<P.x){ b.x=P.x; b.vx=-b.vx*0.6; } if(b.x>P.x+P.w){ b.x=P.x+P.w; b.vx=-b.vx*0.6; }
  const t=performance.now()/900;
  game.players.forEach(p=>{ const d=Math.hypot(b.x-p.x,b.y-p.y); const chase=d<260?0.03:0;
    p.x+=(p.hx+Math.sin(t+p.ph)*14-p.x)*0.02*k+(b.x-p.x)*chase*k; p.y+=(p.hy+Math.cos(t*1.3+p.ph)*14-p.y)*0.02*k+(b.y-p.y)*chase*k;
    if(d<30&&Math.hypot(b.vx,b.vy)<6&&Math.random()<0.15*k){ kickToward(p.team,0.5+Math.random()*0.5); b.vx+=(Math.random()-0.5)*5; } });
}
function resetBall(){ const b=game.ball; b.x=W/2; b.y=P.y+P.h/2; b.vx=b.vy=0; }

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function draw(now){
  // background
  ctx.fillStyle="#0b1220"; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,0,100,W/2,0,1400); g.addColorStop(0,"#1d2b4d"); g.addColorStop(1,"#0b1220"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // header
  ctx.textAlign="center"; ctx.fillStyle="#ffd60a"; ctx.font="900 64px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(game.title,W/2,120);
  ctx.fillStyle="#93a2c4"; ctx.font="700 34px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(`${home.n}  vs  ${away.n}`,W/2,185);
  // pitch
  ctx.save(); rr(P.x-30,P.y-50,P.w+60,P.h+100,36); ctx.clip();
  for(let i=0;i<12;i++){ ctx.fillStyle=i%2?"#2f9e44":"#37b24d"; ctx.fillRect(P.x-30,P.y-50+i*(P.h+100)/12,P.w+60,(P.h+100)/12+1); }
  ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=5; ctx.strokeRect(P.x,P.y,P.w,P.h);
  ctx.beginPath(); ctx.moveTo(P.x,P.y+P.h/2); ctx.lineTo(P.x+P.w,P.y+P.h/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,P.y+P.h/2,110,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(W/2,P.y+P.h/2,7,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
  const bw=480,bh=170,sw=240,sh=70;
  [[P.y,1],[P.y+P.h,-1]].forEach(([y,dir])=>{ ctx.strokeRect(W/2-bw/2,dir>0?y:y-bh,bw,bh); ctx.strokeRect(W/2-sw/2,dir>0?y:y-sh,sw,sh);
    ctx.beginPath(); ctx.arc(W/2,y+dir*bh,110,dir>0?0:Math.PI,dir>0?Math.PI:Math.PI*2); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.3)"; ctx.fillRect(W/2-GOAL_W/2,dir>0?y-34:y,GOAL_W,34); ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2;
    for(let i=0;i<=10;i++){ ctx.beginPath(); ctx.moveTo(W/2-GOAL_W/2+i*20,dir>0?y-34:y); ctx.lineTo(W/2-GOAL_W/2+i*20,dir>0?y:y+34); ctx.stroke(); }
    ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=5; });
  game.players.forEach(p=>{ const t=p.team==="h"?home:away; ctx.beginPath(); ctx.arc(p.x,p.y,16,0,Math.PI*2); ctx.fillStyle=t.col||t.c; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle="#fff"; ctx.stroke(); });
  // watermark on pitch
  ctx.fillStyle="rgba(255,255,255,.55)"; ctx.font="900 40px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(game.handle.toUpperCase(),W/2,P.y+P.h-40);
  drawBall(game.ball.x,game.ball.y,22);
  ctx.restore();
  // scoreboard
  const sy=1420; ctx.fillStyle="#080e1c"; rr(40,sy,W-80,300,36); ctx.fill();
  const logo=(img,t,x)=>{ ctx.save(); ctx.beginPath(); ctx.arc(x,sy+110,80,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.clip();
    if(img) ctx.drawImage(img,x-62,sy+48,124,124); else { ctx.fillStyle="#111"; ctx.font="900 44px sans-serif"; ctx.fillText(t.s,x,sy+126); } ctx.restore();
    ctx.fillStyle="#fff"; ctx.font="800 34px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(fit(t.n,300,34),x,sy+250); };
  logo(game.hImg,home,200); logo(game.aImg,away,W-200);
  ctx.fillStyle="#fff"; ctx.font="900 150px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(`${game.sh} : ${game.sa}`,W/2,sy+165);
  ctx.fillStyle="#1b2740"; rr(W/2-90,sy+200,180,70,18); ctx.fill(); ctx.fillStyle="#ffd60a"; ctx.font="900 46px -apple-system,Segoe UI,Roboto,sans-serif";
  ctx.fillText(game.min>=90?"MS":String(game.min).padStart(2,"0")+"'",W/2,sy+252);
  // CTA
  ctx.fillStyle="#eef3ff"; ctx.font="800 40px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(game.cta,W/2,1810);
  ctx.fillStyle="#93a2c4"; ctx.font="700 28px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(game.handle,W/2,1860);
  // flashes
  const f=game.flash;
  if(f && now-f.t<f.dur){ const p=(now-f.t)/f.dur, a=p<0.15?p/0.15:p>0.8?(1-p)/0.2:1, s=p<0.15?0.6+0.4*(p/0.15):1;
    ctx.save(); ctx.globalAlpha=a; if(f.big){ ctx.fillStyle="rgba(255,214,10,.18)"; ctx.fillRect(0,P.y-50,W,P.h+100); }
    ctx.translate(W/2,P.y+P.h/2); ctx.scale(s,s); ctx.rotate(f.big?-0.1:0);
    ctx.lineWidth=12; ctx.strokeStyle="#000"; ctx.fillStyle="#fff"; ctx.font=`900 ${f.big?170:110}px -apple-system,Segoe UI,Roboto,sans-serif`; ctx.strokeText(f.text,0,0); ctx.fillText(f.text,0,0);
    if(f.sub){ ctx.font="800 56px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.lineWidth=8; ctx.strokeText(f.sub,0,90); ctx.fillStyle="#ffd60a"; ctx.fillText(f.sub,0,90); } ctx.restore(); }
  if(el(now)<LEAD){ ctx.save(); ctx.globalAlpha=1-el(now)/LEAD; ctx.fillStyle="#fff"; ctx.font="900 120px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.lineWidth=10; ctx.strokeStyle="#000"; ctx.strokeText("BAŞLIYOR",W/2,P.y+P.h/2+40); ctx.fillText("BAŞLIYOR",W/2,P.y+P.h/2+40); ctx.restore(); }
  if(game.ftAt){ const p=Math.min(1,(now-game.ftAt)/500); ctx.save(); ctx.globalAlpha=p*0.92; ctx.fillStyle="#080e1c"; ctx.fillRect(0,P.y-50,W,P.h+100); ctx.globalAlpha=p;
    ctx.fillStyle="#ffd60a"; ctx.font="900 96px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText("MAÇ SONU",W/2,P.y+P.h/2-160);
    ctx.fillStyle="#fff"; ctx.font="900 220px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(`${game.sh} - ${game.sa}`,W/2,P.y+P.h/2+40);
    const win=game.sh>game.sa?home.n+" KAZANIR":game.sa>game.sh?away.n+" KAZANIR":"BERABERE"; ctx.fillStyle="#93a2c4"; ctx.font="800 50px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillText(win,W/2,P.y+P.h/2+150); ctx.restore(); }
}
const el=now=>now-game.t0;
function fit(s,maxW,size){ ctx.font=`800 ${size}px -apple-system,Segoe UI,Roboto,sans-serif`; while(ctx.measureText(s).width>maxW&&s.length>3) s=s.slice(0,-2)+"…"; return s; }
function drawBall(x,y,r){ ctx.save(); ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=14; ctx.shadowOffsetY=8; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.restore();
  ctx.fillStyle="#111"; const rot=performance.now()/200; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(x+Math.cos(rot+i*1.26)*r*0.45,y+Math.sin(rot+i*1.26)*r*0.45,r*0.23,0,Math.PI*2); ctx.fill(); } }

/* ---------- BOOT ---------- */
renderLeagueBar();
selectLeague().then(()=>{ const q=new URLSearchParams(location.search); if(q.has("auto")&&teams.length) run(false); });
</script>
